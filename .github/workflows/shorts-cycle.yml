
name: Shorts cycle

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

concurrency:
  group: shorts-cycle
  cancel-in-progress: false
  queue: max

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Restore music rotation state
      - name: Restore music rotation state
        uses: actions/cache@v4
        with:
          path: output/state.json
          key: music-state
          restore-keys: |
            music-state

      # 3. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # 4. Install system packages only when needed
      - name: System packages (FFmpeg + fonts + Chromium libraries)
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail

          PACKAGES=(
            ffmpeg
            fonts-noto-core
            fonts-noto-color-emoji
            fonts-dejavu-core
            libnss3
            libatk1.0-0
            libatk-bridge2.0-0
            libcups2
            libdrm2
            libxkbcommon0
            libxcomposite1
            libxdamage1
            libxfixes3
            libxrandr2
            libgbm1
            libasound2
          )

          MISSING=()

          for package in "${PACKAGES[@]}"; do
            if ! dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -q "install ok installed"; then
              MISSING+=("$package")
            fi
          done

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "Missing packages: ${MISSING[*]}"

            UPDATED=false

            for attempt in 1 2 3; do
              echo "APT update attempt $attempt"

              if sudo apt-get update \
                -o APT::Update::Error-Mode=any \
                -o Acquire::Retries=3 \
                -o Acquire::http::Timeout=30 \
                -o Acquire::https::Timeout=30; then
                UPDATED=true
                break
              fi

              sleep 10
            done

            if [ "$UPDATED" != "true" ]; then
              echo "APT update failed after retries."
              exit 1
            fi

            INSTALLED=false

            for attempt in 1 2 3; do
              echo "Package installation attempt $attempt"

              if sudo apt-get install -y --no-install-recommends "${MISSING[@]}"; then
                INSTALLED=true
                break
              fi

              sleep 10
            done

            if [ "$INSTALLED" != "true" ]; then
              echo "Package installation failed."
              exit 1
            fi
          else
            echo "All required system packages are already installed."
          fi

          echo "Checking FFmpeg..."
          ffmpeg -version | head -n 2

          echo "System packages ready."

      # 5. Install Python dependencies
      - name: Python packages
        timeout-minutes: 10
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip \
            --retries 5 \
            --timeout 30

          python -m pip install \
            --retries 5 \
            --timeout 30 \
            -r requirements.txt

      # 6. Install Playwright Chromium
      - name: Install Playwright Chromium binary
        timeout-minutes: 5
        run: |
          set -euo pipefail
          python -m playwright install chromium

      # 7. Verify environment
      - name: Verify environment
        run: |
          set -euo pipefail

          echo "Python:"
          python --version

          echo "FFmpeg:"
          ffmpeg -version | head -n 2

          echo "Playwright:"
          python -m playwright --version

          echo "Environment verification successful."

      # 8. Run Shorts automation
      - name: Run all active users
        timeout-minutes: 15
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MASTER_ENCRYPTION_KEY: ${{ secrets.MASTER_ENCRYPTION_KEY }}
        run: |
          python main.py

      # 9. Diagnostics
      - name: Diagnose scheduled trigger
        if: always()
        run: |
          echo "================================"
          echo "Shorts cycle diagnostics"
          echo "================================"

          echo "Event: $GITHUB_EVENT_NAME"
          echo "UTC time: $(date -u)"
          echo "India time: $(TZ=Asia/Kolkata date)"
          echo "Branch: $GITHUB_REF"
          echo "Commit: $GITHUB_SHA"
          echo "Runner: $RUNNER_OS"

          echo "================================"
