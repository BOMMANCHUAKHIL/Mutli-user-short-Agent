
name: Shorts cycle

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

concurrency:
  group: shorts-cycle
  cancel-in-progress: false
  queue: max

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Restore music rotation state
        uses: actions/cache@v4
        with:
          path: output/state.json
          key: music-state
          restore-keys: |
            music-state

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: System packages (FFmpeg + fonts + Chromium libraries)
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -e

          echo "Checking system packages..."

          if ! command -v ffmpeg >/dev/null 2>&1; then
            echo "FFmpeg not found. Installing system packages..."

            for attempt in 1 2 3; do
              echo "APT update attempt $attempt..."

              if sudo apt-get update \
                -o Acquire::Retries=5 \
                -o Acquire::http::Timeout=30 \
                -o Acquire::https::Timeout=30; then
                break
              fi

              if [ "$attempt" -eq 3 ]; then
                echo "APT update failed after 3 attempts"
                exit 1
              fi

              sleep 10
            done

            for attempt in 1 2 3; do
              echo "APT install attempt $attempt..."

              if sudo apt-get install -y --no-install-recommends \
                ffmpeg \
                fonts-noto-core fonts-noto-color-emoji fonts-dejavu-core \
                libnss3 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 \
                libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64; then
                break
              fi

              if [ "$attempt" -eq 3 ]; then
                echo "Package installation failed after 3 attempts"
                exit 1
              fi

              sleep 10
            done
          else
            echo "FFmpeg already available."
          fi

          ffmpeg -version | head -n 2

      - name: Python packages
        timeout-minutes: 10
        run: |
          python -m pip install --upgrade pip
          pip install --retries 5 --timeout 30 -r requirements.txt

      - name: Install Playwright Chromium binary
        timeout-minutes: 5
        run: |
          python -m playwright install chromium

      - name: Verify environment
        run: |
          python --version
          ffmpeg -version
          python -m playwright --version

      - name: Run all active users
        timeout-minutes: 15
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MASTER_ENCRYPTION_KEY: ${{ secrets.MASTER_ENCRYPTION_KEY }}
        run: python main.py

      - name: Diagnose scheduled trigger
        if: always()
        run: |
          echo "Event: $GITHUB_EVENT_NAME"
          echo "UTC time: $(date -u)"
          echo "India time: $(TZ=Asia/Kolkata date)"
          echo "Branch: $GITHUB_REF"
          echo "Commit: $GITHUB_SHA"
